<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uygulamalar | IF22 Software</title>
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('if22-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="site.js" defer></script>
    <script src="i18n.js" defer></script>
    <script src="apps-data.js" defer></script>
    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px;
            padding-bottom: 80px;
        }
        .app-card {
            display: flex; flex-direction: column;
            text-decoration: none; color: var(--ink);
            transition: transform 0.12s, box-shadow 0.12s;
        }
        .app-card:hover { transform: translate(-3px,-3px); box-shadow: 10px 10px 0 var(--line); }
        .app-card:active { transform: translate(4px,4px); box-shadow: 2px 2px 0 var(--line); }
        .app-card .top {
            position: relative;
            height: 150px;
            border-bottom: 3px solid var(--line);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .app-card .top::before {
            content: ''; position: absolute; inset: 0;
            background-image: radial-gradient(rgba(17,17,17,0.18) 1.5px, transparent 1.5px);
            background-size: 16px 16px;
        }
        .tile {
            position: relative;
            width: 92px; height: 92px;
            border: 3px solid #111;
            border-radius: 24%;
            box-shadow: 4px 4px 0 #111;
            overflow: hidden;
            background: #fff;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 1.75rem; color: #111;
            transform: rotate(-4deg);
            transition: transform 0.2s;
        }
        .tile img { width: 100%; height: 100%; object-fit: cover; }
        .app-card:hover .tile { transform: rotate(3deg) scale(1.06); }
        .app-card .top .badge { position: absolute; top: 12px; right: 12px; }
        .app-card .body { padding: 18px 20px 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .app-card h2 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; }
        .app-card p { margin-top: 6px; color: var(--muted); line-height: 1.45; flex-grow: 1; }
        .app-card .meta { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .app-card .platforms { color: var(--muted); font-size: 0.6875rem; }
        .app-card .go { font-weight: 800; }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="nav-inner">
            <a href="index.html" class="logo">IF22 Software</a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html" data-i18n="nav.home">Ana Sayfa</a></li>
                    <li><a href="apps.html" class="active" data-i18n="nav.apps">Uygulamalar</a></li>
                    <li><a href="team.html" data-i18n="nav.team">Ekibimiz</a></li>
                    <li><a href="contact.html" data-i18n="nav.contact">İletişim</a></li>
                </ul>
            </nav>
            <div class="nav-controls">
                <button class="lang-toggle" id="langToggle">EN</button>
                <button class="theme-toggle" id="themeToggle" aria-label="Tema değiştir">
                    <svg id="iconSun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    <svg id="iconMoon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="wrap">
            <div class="page-head">
                <h1><span class="highlight" data-i18n="apps.title">Uygulamalar</span></h1>
                <p data-i18n="apps.sub">Şimdiye kadar yaptıklarımız. Birine tıkla, yakından bak.</p>
            </div>
            <div class="grid" id="grid"></div>
        </div>
    </main>

    <footer>
        <div class="footer-inner">
            <p data-i18n="footer.rights">© 2026 IF22 Software. Tüm hakları saklıdır.</p>
            <a href="contact.html" data-i18n="nav.contact">İletişim</a>
        </div>
    </footer>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        'use strict';
        var grid = document.getElementById('grid');
        var i18n = window.if22i18n;

        function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        function render() {
            var lang = i18n.lang();
            grid.innerHTML = window.IF22_APPS.map(function (a) {
                var tile = a.logo
                    ? '<div class="tile"><img src="' + a.logo + '" alt=""></div>'
                    : '<div class="tile">' + esc(a.initials) + '</div>';
                var badge = a.status === 'live'
                    ? '<span class="badge badge-live mono">' + esc(i18n.t('apps.live')) + '</span>'
                    : '<span class="badge badge-soon mono">' + esc(i18n.t('apps.soon')) + '</span>';
                return '<a class="app-card box" href="app.html?app=' + a.id + '">' +
                    '<div class="top" style="background:' + a.color + '">' + tile + badge + '</div>' +
                    '<div class="body">' +
                        '<h2>' + esc(a.name) + '</h2>' +
                        '<p>' + esc(a.tagline[lang]) + '</p>' +
                        '<div class="meta"><span class="platforms mono">' + esc(a.platforms.join(' · ')) + '</span>' +
                        '<span class="go">' + esc(i18n.t('apps.view')) + '</span></div>' +
                    '</div></a>';
            }).join('');
        }

        render();
        document.addEventListener('if22:lang', render);
    });
    </script>
</body>
</html>
