<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IF22 Software</title>
    <meta name="description" content="IF22 Software — iki kişilik bağımsız bir mobil uygulama stüdyosu. Hibi, Net Sayacım, PomoQuest, SpendWise, Dream Oracle.">
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('if22-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="site.js" defer></script>
    <script src="i18n.js" defer></script>
    <script src="apps-data.js" defer></script>
    <style>
        .play {
            position: relative;
            flex-grow: 1;
            min-height: 440px;
            overflow: hidden;
            background-image: radial-gradient(var(--dot) 1.5px, transparent 1.5px);
            background-size: 22px 22px;
        }

        .floater {
            position: absolute; left: 0; top: 0;
            display: block;
            border: 3px solid var(--line);
            border-radius: 24%;
            box-shadow: 5px 5px 0 var(--line);
            touch-action: none;
            user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: grab;
            will-change: transform;
            z-index: 2;
        }
        .floater img {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: calc(24% - 2px);
            pointer-events: none;
        }
        .floater.held { cursor: grabbing; z-index: 4; box-shadow: 10px 10px 0 var(--line); }
        .floater .tag {
            position: absolute; left: 50%; top: calc(100% + 12px);
            transform: translateX(-50%);
            white-space: nowrap;
            padding: 4px 9px;
            background: var(--ink); color: var(--bg);
            border: 2px solid var(--line);
            opacity: 0; pointer-events: none;
            transition: opacity 0.12s;
        }
        .floater:hover .tag, .floater:focus-visible .tag, .floater.held .tag { opacity: 1; }

        .corner {
            position: absolute; z-index: 3;
            pointer-events: none;
        }
        .corner-bl {
            left: 20px; bottom: 20px;
            padding: 14px 18px;
            max-width: 340px;
            background: var(--surface);
            border: 3px solid var(--line);
            box-shadow: var(--shadow);
        }
        .corner-bl strong { display: block; font-size: 1.375rem; font-weight: 800; letter-spacing: -0.03em; }
        .corner-bl span { display: block; margin-top: 2px; color: var(--muted); font-size: 0.95rem; line-height: 1.4; }
        .corner-br {
            right: 20px; bottom: 20px;
            padding: 6px 10px;
            background: var(--yellow); color: var(--on-color);
            border: 2px solid var(--line);
            transform: rotate(2deg);
        }
        @media (max-width: 640px) {
            .corner-bl { left: 12px; right: 12px; bottom: 12px; max-width: none; padding: 10px 14px; }
            .corner-bl strong { font-size: 1.125rem; }
            .corner-br { right: 12px; bottom: auto; top: 12px; }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="nav-inner">
            <a href="index.html" class="logo">IF22 Software</a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html" class="active" data-i18n="nav.home">Ana Sayfa</a></li>
                    <li><a href="apps.html" data-i18n="nav.apps">Uygulamalar</a></li>
                    <li><a href="team.html" data-i18n="nav.team">Ekibimiz</a></li>
                    <li><a href="contact.html" data-i18n="nav.contact">İletişim</a></li>
                </ul>
            </nav>
            <div class="nav-controls">
                <button class="lang-toggle" id="langToggle">EN</button>
                <button class="theme-toggle" id="themeToggle" aria-label="Tema değiştir">
                    <svg id="iconSun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    <svg id="iconMoon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="play" id="play">
        <div class="corner corner-bl">
            <strong>IF22 Software</strong>
            <span data-i18n="index.about">İki kişilik bağımsız bir mobil uygulama stüdyosu.</span>
        </div>
        <p class="corner corner-br mono" id="hint" data-i18n="index.hint">Logoları tut, fırlat ya da birine tıkla.</p>
    </main>

    <footer>
        <div class="footer-inner">
            <p data-i18n="footer.rights">© 2026 IF22 Software. Tüm hakları saklıdır.</p>
            <a href="apps.html" data-i18n="footer.privacy">Gizlilik Politikaları</a>
        </div>
    </footer>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        'use strict';

        var play = document.getElementById('play');
        var caption = document.querySelector('.corner-bl');
        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var touch = window.matchMedia('(pointer: coarse)').matches;
        var apps = window.IF22_APPS.filter(function (a) { return a.logo; });
        var W = 0, H = 0, size = 160;
        var L = 0, T = 0, R = 0, B = 0;   // the arena the logos bounce around in
        var bodies = [];
        var RESTITUTION = 0.5;

        if (touch) {
            var hint = document.getElementById('hint');
            hint.setAttribute('data-i18n', 'index.hint.touch');
            hint.textContent = window.if22i18n.t('index.hint.touch');
        }

        // Logos are big and share a compact arena in the middle, so they stay close together.
        function measure() {
            W = play.clientWidth; H = play.clientHeight;
            var reserve = W < 640 ? caption.offsetHeight + 24 : 0;
            var usableH = H - reserve;
            size = Math.round(Math.max(84, Math.min(140, Math.min(W, usableH) * 0.2)));
            var aw = Math.min(W - 32, size * 4.6);
            var ah = Math.min(usableH - 32, size * 3.3);
            L = (W - aw) / 2; R = L + aw;
            T = (usableH - ah) / 2; B = T + ah;
        }
        measure();

        function rand(a, b) { return a + Math.random() * (b - a); }

        apps.forEach(function (app) {
            var el = document.createElement('a');
            el.className = 'floater';
            el.href = 'app.html?app=' + app.id;
            el.style.background = app.color;
            el.setAttribute('aria-label', app.name);
            el.draggable = false;
            el.innerHTML = '<img src="' + app.logo + '" alt="" draggable="false"><span class="tag mono"></span>';
            el.querySelector('.tag').textContent = app.name;
            play.appendChild(el);

            var speed = reduced ? 0 : rand(45, 75);
            var dir = rand(0, Math.PI * 2);
            bodies.push({
                el: el, x: 0, y: 0,
                vx: Math.cos(dir) * speed, vy: Math.sin(dir) * speed,
                cruise: speed,
                rot: rand(-8, 8), vr: reduced ? 0 : rand(-10, 10),
                held: false, hover: false, dragged: false
            });
        });

        function applySize() {
            bodies.forEach(function (b) {
                b.r = size / 2;
                b.el.style.width = b.el.style.height = size + 'px';
            });
        }
        applySize();

        // Scatter inside the arena, avoiding overlaps where there is room.
        bodies.forEach(function (b, i) {
            for (var tries = 0; tries < 300; tries++) {
                b.x = rand(L + b.r, Math.max(L + b.r, R - b.r));
                b.y = rand(T + b.r, Math.max(T + b.r, B - b.r));
                var ok = true;
                for (var j = 0; j < i; j++) {
                    var o = bodies[j];
                    if (Math.hypot(o.x - b.x, o.y - b.y) < b.r + o.r + 8) { ok = false; break; }
                }
                if (ok) break;
            }
        });

        function render(b) {
            b.el.style.transform = 'translate(' + (b.x - b.r) + 'px,' + (b.y - b.r) + 'px) rotate(' + b.rot + 'deg)';
        }

        function invMass(b) { return (b.held || b.hover) ? 0 : 1; }

        function step(dt) {
            bodies.forEach(function (b) {
                if (b.held || b.hover) return;
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                b.rot += b.vr * dt;
                if (b.rot > 10 || b.rot < -10) { b.rot = Math.max(-10, Math.min(10, b.rot)); b.vr = -b.vr; }

                // ease thrown logos back to their cruising speed
                var sp = Math.hypot(b.vx, b.vy);
                if (sp > 0.01) {
                    var target = sp + (b.cruise - sp) * Math.min(1, dt * 3);
                    b.vx *= target / sp; b.vy *= target / sp;
                }

                // Arena walls only turn a logo around, so one thrown outside drifts back in.
                if (b.x < L + b.r) b.vx = Math.abs(b.vx);
                if (b.x > R - b.r) b.vx = -Math.abs(b.vx);
                if (b.y < T + b.r) b.vy = Math.abs(b.vy);
                if (b.y > B - b.r) b.vy = -Math.abs(b.vy);
                b.x = Math.max(b.r, Math.min(W - b.r, b.x));
                b.y = Math.max(b.r, Math.min(H - b.r, b.y));
            });

            for (var i = 0; i < bodies.length; i++) {
                for (var j = i + 1; j < bodies.length; j++) {
                    var a = bodies[i], c = bodies[j];
                    var dx = c.x - a.x, dy = c.y - a.y;
                    var d = Math.hypot(dx, dy), min = a.r + c.r;
                    if (d >= min || d === 0) continue;
                    var ia = invMass(a), ic = invMass(c);
                    if (ia + ic === 0) continue;
                    var nx = dx / d, ny = dy / d;
                    var push = (min - d) / (ia + ic);
                    a.x -= nx * push * ia; a.y -= ny * push * ia;
                    c.x += nx * push * ic; c.y += ny * push * ic;
                    var rel = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;
                    if (rel < 0) {
                        // restitution < 1 so a thrown logo loses energy instead of pinballing
                        var imp = -(1 + RESTITUTION) * rel / (ia + ic);
                        a.vx -= imp * ia * nx; a.vy -= imp * ia * ny;
                        c.vx += imp * ic * nx; c.vy += imp * ic * ny;
                        if (!reduced) { a.vr = rand(-14, 14); c.vr = rand(-14, 14); }
                    }
                }
            }
            bodies.forEach(render);
        }

        var last = performance.now();
        function tick(now) {
            var dt = Math.min(0.033, (now - last) / 1000);
            last = now;
            step(dt);
            requestAnimationFrame(tick);
        }
        bodies.forEach(render);
        requestAnimationFrame(tick);

        // ── Grab, throw, click ──
        bodies.forEach(function (b) {
            var el = b.el, ox = 0, oy = 0, sx = 0, sy = 0, samples = [];

            el.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') b.hover = true; });
            el.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') b.hover = false; });

            el.addEventListener('pointerdown', function (e) {
                if (e.button !== 0) return;
                var rect = play.getBoundingClientRect();
                b.held = true; b.dragged = false;
                el.classList.add('held');
                el.setPointerCapture(e.pointerId);
                ox = e.clientX - rect.left - b.x;
                oy = e.clientY - rect.top - b.y;
                sx = e.clientX; sy = e.clientY;
                samples = [{ x: e.clientX, y: e.clientY, t: performance.now() }];
            });

            el.addEventListener('pointermove', function (e) {
                if (!b.held) return;
                if (Math.hypot(e.clientX - sx, e.clientY - sy) > 6) b.dragged = true;
                var rect = play.getBoundingClientRect();
                b.x = Math.max(b.r, Math.min(W - b.r, e.clientX - rect.left - ox));
                b.y = Math.max(b.r, Math.min(H - b.r, e.clientY - rect.top - oy));
                samples.push({ x: e.clientX, y: e.clientY, t: performance.now() });
                if (samples.length > 6) samples.shift();
                render(b);
            });

            function release() {
                if (!b.held) return;
                b.held = false;
                el.classList.remove('held');
                if (b.dragged && samples.length > 1) {
                    var s0 = samples[0], s1 = samples[samples.length - 1];
                    var t = Math.max(0.016, (s1.t - s0.t) / 1000);
                    var vx = (s1.x - s0.x) / t, vy = (s1.y - s0.y) / t;
                    var sp = Math.hypot(vx, vy), max = 650;
                    if (sp > max) { vx *= max / sp; vy *= max / sp; }
                    if (sp < 20) { var a = rand(0, Math.PI * 2); vx = Math.cos(a) * b.cruise; vy = Math.sin(a) * b.cruise; }
                    b.vx = reduced ? 0 : vx; b.vy = reduced ? 0 : vy;
                    b.hover = false;
                }
            }
            el.addEventListener('pointerup', release);
            el.addEventListener('pointercancel', release);

            el.addEventListener('click', function (e) {
                if (b.dragged) { e.preventDefault(); b.dragged = false; }
            });
            el.addEventListener('dragstart', function (e) { e.preventDefault(); });
        });

        window.addEventListener('resize', function () {
            measure();
            applySize();
            bodies.forEach(function (b) {
                b.x = Math.max(L + b.r, Math.min(R - b.r, b.x));
                b.y = Math.max(T + b.r, Math.min(B - b.r, b.y));
                render(b);
            });
        });
    });
    </script>
</body>
</html>
